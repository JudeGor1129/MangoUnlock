name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: true
      - name: Checkout SDKs
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          path: theos/sdks
          submodules: true
      - name: Install ldid
        run: |
          curl -sL -o /tmp/ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          sudo install -m755 /tmp/ldid /usr/local/bin/ldid
      - name: Build
        run: make package THEOS_PACKAGE_SCHEME=rootless
        env:
          THEOS: ${{ github.workspace }}/theos
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: packages/*.deb
